{% load i18n admin_urls %}
{% block object-tools-items %}
<li>
    {% url opts|admin_urlname:'history' original.pk|admin_urlquote as history_url %}
    <a href="{% add_preserved_filters history_url %}" class="historylink"><span class="tool-icon history-icon" aria-hidden="true"></span>{% translate 'History' %}</a>
</li>
{% if has_absolute_url %}<li><a href="{{ absolute_url }}" class="viewsitelink"><span class="tool-icon external-icon" aria-hidden="true"></span>{% translate 'View on site' %}</a></li>{% endif %}
{% endblock %}
