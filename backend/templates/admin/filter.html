{% load i18n %}
<details class="admin-filter-group" data-filter-title="{{ title }}" open>
    <summary>
        <span>{{ title }}</span>
        <span class="admin-chevron" aria-hidden="true"></span>
    </summary>
    <ul>
        {% for choice in choices %}
        <li{% if choice.selected %} class="selected"{% endif %}>
            <a href="{{ choice.query_string|iriencode }}"{% if choice.selected %} aria-current="true"{% endif %}>
                <span>{{ choice.display }}</span>
                {% if choice.selected %}<span class="filter-selected-mark" aria-hidden="true"></span>{% endif %}
            </a>
        </li>
        {% endfor %}
    </ul>
</details>
